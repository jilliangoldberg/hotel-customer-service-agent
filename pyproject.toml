[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-customer-service-agent"
version = "0.1.0"
description = "A hotel guest support agent built with the OpenAI Agents SDK."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask",
    "openai>=3.0,<4",
    "openai-agents>=0.23.1,<0.24",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
support-agent = "support_agent.__main__:main"
support-agent-web = "support_agent.web:main"
support-agent-eval = "support_agent.eval.__main__:main"

[tool.setuptools.package-data]
support_agent = ["templates/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
